name: Secret scan

on:
  pull_request:
    branches: [main, master, master-rebuild]
  push:
    branches: [main, master, master-rebuild]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # Use the gitleaks binary directly. The gitleaks-action requires a paid
      # GITLEAKS_LICENSE for organisation repos; the binary is MIT and needs none.
      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (full history)
        run: |
          gitleaks detect --config .gitleaks.toml --redact --verbose
