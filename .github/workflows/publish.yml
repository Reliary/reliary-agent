name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (cargo publish --dry-run)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38
        with:
          toolchain: stable

      - name: Verify
        run: cargo check --workspace --release

      - name: Test
        run: cargo test --workspace --release

      # Publish in dependency order. Each crate is published individually so a
      # transient "already uploaded" (idempotent re-run) does not abort the rest.
      # A short sleep lets the crates.io index propagate before dependents resolve
      # their (now-published) workspace dependency.
      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          for crate in reliary-core reliary-memory reliary-compress reliary-sift \
                       reliary-risk reliary-fix reliary-dead reliary-edit \
                       reliary-search reliary-output reliary-pack reliary-agent; do
            echo "::group::dry-run $crate"
            cargo publish -p "$crate" --dry-run --allow-dirty --no-verify
            echo "::endgroup::"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          publish() {
            crate="$1"
            echo "::group::publish $crate"
            if cargo publish -p "$crate" --no-verify; then
              echo "published $crate"
            else
              echo "publish of $crate failed (may already be published) — continuing"
            fi
            echo "::endgroup::"
            sleep 20
          }
          for crate in reliary-core reliary-memory reliary-compress reliary-sift \
                       reliary-risk reliary-fix reliary-dead reliary-edit \
                       reliary-search reliary-output reliary-pack reliary-agent; do
            publish "$crate"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
