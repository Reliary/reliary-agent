name: CI
on:
  push:
    branches: [main, master, master-rebuild]
  pull_request:
    branches: [main, master, master-rebuild]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38
        with:
          toolchain: stable
          components: clippy

      - name: Install tools
        run: |
          cargo install cargo-audit cargo-deny 2>/dev/null || true

      - name: Build
        run: cargo build --release

      # Smoke-check the cross target the release workflow ships, so a
      # `cfg(unix)`-only API or a target-specific dependency breaks here and not
      # on release day. (macOS and Windows cannot be built on a Linux runner;
      # they are exercised by their own release-matrix jobs.)
      - name: Cross-compile check (aarch64-linux)
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          cargo check --workspace --release --target aarch64-unknown-linux-gnu

      # The release artifacts are the product. Build one on every push so a
      # broken release build is caught by CI, and so a branch build is
      # downloadable without cutting a tag (Stria does the same).
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reliary-linux-x86_64
          path: target/release/reliary
          if-no-files-found: error

      # `cargo install reliary-agent` builds from the published tarball, which
      # contains only what is inside the crate directory. An `include_str!`
      # reaching above it (the hooks used to live at the repo root) compiles
      # locally and ships broken. `cargo package` verifies the tarball
      # compiles; run it for every crate so it cannot regress.
      - name: crates are publishable (package + verify)
        run: |
          for crate in reliary-core reliary-memory reliary-compress reliary-sift \
                       reliary-risk reliary-fix reliary-dead reliary-edit \
                       reliary-search reliary-output reliary-pack reliary-agent; do
            echo "::group::package $crate"
            cargo package -p "$crate" --allow-dirty
            echo "::endgroup::"
          done

      - name: cargo test
        run: cargo test --workspace --release

      - name: clippy
        run: cargo clippy --all-targets --release -- -D warnings 2>&1 || { echo 'clippy FAIL'; exit 1; }

      # The reliary-agent tests spawn the real binary as a subprocess, so the
      # release build must exist before they run. `cargo test` builds it via
      # CARGO_BIN_EXE_, but the OpenCode plugin tests below need node/npm.
      - name: OpenCode plugin tests
        run: |
          cd opencode-plugin
          npm ci --no-audit --no-fund
          # The committed dist/ is the artifact users install. A rebuild must
          # reproduce it byte-for-byte, or the committed artifact is stale
          # relative to src/.
          npm run build
          if ! git diff --exit-code -- dist; then
            echo "FAIL: opencode-plugin/dist is stale — run 'npm run build' and commit the result"
            exit 1
          fi
          # Drive the real reindex path, not just the pure functions, and
          # assert the real-binary test actually ran (a silent skip would
          # otherwise look green). Verbose reporter prints passing test names;
          # the default reporter only prints failures.
          RELIARY_TEST_BIN="$GITHUB_WORKSPACE/target/release/reliary" \
            npm test -- --reporter=verbose 2>&1 | tee /tmp/plugin-test.log
          if ! grep -q "finds the project root and reindexes an edited file" /tmp/plugin-test.log; then
            echo "FAIL: the real-reindex integration test did not run"; exit 1
          fi
          if grep -q "reindex-file did not make the new symbol searchable" /tmp/plugin-test.log; then
            echo "FAIL: real-reindex integration test reported a failure"; exit 1
          fi

      # Hooks are invoked by agents with `sh`, so they must be POSIX-safe
      # regardless of their shebang. `sh -n` catches syntax errors; the grep
      # catches bash-isms that dash parses differently at runtime (the V74
      # class: `[[ ]]`, `$'...'`, `<<<`). Comments are stripped first — a
      # comment that *names* a bash-ism is not one.
      - name: hook scripts are POSIX-safe
        run: |
          fail=""
          for f in crates/reliary-agent/hooks/*.sh; do
            if ! sh -n "$f" 2>/dev/null; then
              echo "FAIL: $f is not valid POSIX sh"; sh -n "$f"; fail=1
            fi
            hits=$(grep -vE '^[[:space:]]*#' "$f" | grep -nE '\[\[|\$'"'"'|<<<' || true)
            if [ -n "$hits" ]; then
              echo "FAIL: $f contains a bash-ism ([[, \$'...', or <<<):"
              echo "$hits"
              fail=1
            fi
          done
          [ -z "$fail" ] || exit 1
          echo "all hook scripts are POSIX-safe"

      # The Pi extension is the shim every Pi session runs. Drive its binary
      # discovery and reindex path without a live agent.
      - name: Pi gate.js selftest
        run: |
          proj=$(mktemp -d)
          printf 'pub fn alpha() -> i32 { 1 }\n' > "$proj/lib.rs"
          (cd "$proj" && "$GITHUB_WORKSPACE/target/release/reliary" trust . >/dev/null)
          RELIARY_BIN_PATH="$GITHUB_WORKSPACE/target/release/reliary" \
            node crates/reliary-agent/pi/gate.js --selftest "$proj/lib.rs"

      - name: no openssl-sys (cross-compile sanity)
        run: |
          if cargo tree -e normal 2>/dev/null | grep -q "openssl-sys"; then
            echo "openssl-sys blocks ARM"; exit 1; fi

      # SECURITY.md claims zero unsafe code in the core crates. Enforce it at
      # compile time (every crate root carries #![forbid(unsafe_code)]) and
      # assert the attribute is still present so the claim cannot silently rot.
      - name: no unsafe code in first-party crates
        run: |
          missing=""
          for f in crates/*/src/lib.rs crates/reliary-agent/src/main.rs; do
            head -1 "$f" | grep -q '^#!\[forbid(unsafe_code)\]$' || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "FAIL: crates missing #![forbid(unsafe_code)]:$missing"; exit 1
          fi
          echo "all first-party crate roots forbid unsafe"

      - name: no keyword matching in scoring hot path
        run: |
          bad=$(grep -rnE '"(fn|def|class|function|impl|func|fn_name)"' crates/reliary-search/src/ --include="*.rs" 2>/dev/null | \
            grep -v "test\|// ok\|GUARDED\|#\[cfg" | grep -E "(classify|predict|enrich|tag)|stem_line_text_score|role_purity" || true)
          if [ -n "$bad" ]; then echo "FAIL: keyword matching in hot path"; echo "$bad"; exit 1; fi

      - name: no jpg/png binary artifacts in repo
        run: |
          if git ls-files | grep -qE '\.(jpe?g|png|gif|bmp|ico)$'; then
            echo "Binary images committed"; git ls-files | grep -E '\.(jpe?g|png|gif|bmp|ico)$'
            exit 1
          fi

      # Junk cannot be re-tracked. These paths were previously committed
      # (node_modules: 5,453 files, bench/results: 469) and every release
      # depended on a hand-built squash to exclude them.
      - name: no vendored/generated files tracked
        run: |
          # opencode-plugin/dist/index.js is the built npm artifact and is
          # intentionally committed (the plugin installs from the repo).
          bad=$(git ls-files | grep -E '(^|/)(node_modules|__pycache__|target|dist|\.reliary)/|\.pyc$|\.sqlite(-journal|-shm|-wal)?$' \
            | grep -v '^opencode-plugin/dist/' | head -20 || true)
          if [ -n "$bad" ]; then
            echo "FAIL: vendored/generated paths are tracked:"; echo "$bad"; exit 1
          fi
          # bench/results is allowed to contain only the durable bench inputs
          # (the public_* question/GT fixtures public_bench.py reads). Ad-hoc
          # run outputs, logs, and snapshots are not tracked.
          extra=$(git ls-files bench/results | grep -vE '^bench/results/public_(gt|questions|harness_questions)\.json$' | head -5 || true)
          if [ -n "$extra" ]; then
            echo "FAIL: untracked-by-policy files under bench/results:"; echo "$extra"; exit 1
          fi

      - name: no sqlite runtime DBs committed
        run: |
          if git ls-files | grep -qE '\.sqlite(-journal|-shm|-wal)?$'; then
            echo "SQLite runtime DBs committed"; git ls-files | grep -E '\.sqlite'; exit 1
          fi

      - name: CLI commands documented in README
        run: |
          # Extract only the CLI_COMMANDS array literal (from `= &[` to `];`),
          # not an arbitrary 50-line window — that window used to drift into
          # other string literals (e.g. a subcommand's default_value) and
          # report phantom missing commands.
          cmds=$(python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("crates/reliary-agent/src/main.rs").read_text()
          m = re.search(r'CLI_COMMANDS[^=]*=\s*&\[(.*?)\];', src, re.S)
          if not m:
              raise SystemExit("CLI_COMMANDS array not found")
          print("\n".join(sorted(set(re.findall(r'"([a-z][a-z-]+)"', m.group(1))))))
          PY
          )
          missing=""
          for cmd in $cmds; do
            if ! grep -q "$cmd" README.md 2>/dev/null; then missing="$missing  $cmd"; fi
          done
          if [ -n "$missing" ]; then echo "FAIL: missing from README:$missing"; exit 1; fi

      # Advisory scanning is enforced by the Hardening workflow (cargo-deny).
      # The previous `cargo audit || true` here was decorative — it could not
      # fail the build. Removed rather than faked.

      # Test count must not silently drop. The e2e layer is the regression
      # detector for protocol/process behavior; a falling count means tests
      # were deleted or are skipping. Ratchet: recorded floor, raise over time.
      - name: test count ratchet
        run: |
          count=$(cargo test --workspace --release 2>&1 | grep "^test result:" | \
            grep -oP '\d+(?= passed)' | \
            python3 -c "import sys; print(sum(int(l) for l in sys.stdin if l.strip()))")
          echo "Test count: $count"
          FLOOR=430
          if [ "$count" -lt "$FLOOR" ]; then
            echo "FAIL: test count $count is below the floor of $FLOOR — tests were removed or started skipping"
            exit 1
          fi

      # The e2e test files must actually contain their tests and not have been
      # emptied (a compile-time guard against tests that were gutted to pass).
      - name: e2e suites are non-empty
        run: |
          for f in crates/reliary-agent/tests/e2e_mcp.rs \
                   crates/reliary-agent/tests/e2e_cli.rs \
                   crates/reliary-agent/tests/e2e_adversarial.rs; do
            n=$(grep -c '^#\[test\]' "$f" || true)
            echo "$f: $n tests"
            if [ "$n" -lt 10 ]; then
              echo "FAIL: $f has only $n tests (expected >= 10)"; exit 1
            fi
          done
          # Guard against "pass by skipping": the adversarial and pack suites
          # must not silently return early on every test.
          skips=$(grep -rn 'pack_or_skip\|else { return }' crates/reliary-agent/tests/e2e_*.rs crates/reliary-pack/tests/*.rs 2>/dev/null | wc -l)
          echo "early-return skip sites: $skips"
          if [ "$skips" -gt 0 ]; then
            echo "FAIL: test suites contain pass-by-skip early returns"; exit 1
          fi

      # The integration-conformance tests are the regression detector for the
      # init ↔ settings ↔ doctor ↔ uninstall loop. If they are deleted the
      # dangling-hook class comes back silently.
      - name: integration conformance tests present
        run: |
          for t in e2e_cli_init_registers_resolvable_hooks \
                   e2e_cli_doctor_reports_wired_integrations \
                   e2e_cli_init_dry_run_mutates_nothing \
                   e2e_cli_reinit_does_not_duplicate_hooks \
                   e2e_cli_uninstall_removes_hooks_and_registrations \
                   e2e_cli_doctor_flags_dangling_hook_registration \
                   e2e_cli_doctor_flags_unusable_index \
                   e2e_mcp_hook_scripts_only_name_advertised_tools; do
            if ! grep -rq "fn $t(" crates/reliary-agent/tests/; then
              echo "FAIL: integration conformance test $t is missing"; exit 1
            fi
          done
          echo "integration conformance tests present"

      # V75: the bench cassette (record/replay determinism). Pure-Python unit
      # + harness-integration tests; no network, no API key, no corpus.
      # The runner's system Python has no pytest and is PEP-668 managed, so
      # use a throwaway venv instead of touching the system interpreter.
      - name: bench cassette tests
        run: |
          python3 -m venv /tmp/pytest-venv
          /tmp/pytest-venv/bin/pip install --quiet pytest
          /tmp/pytest-venv/bin/python -m pytest bench/tests/ -q

      - name: binary size
        run: ls -lh target/release/reliary
