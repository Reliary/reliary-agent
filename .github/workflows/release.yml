name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Build one artifact per supported platform. Asset naming is the contract the
  # `reliary update` subcommand depends on:
  #   reliary-agent-v{VERSION}-{os}-{arch}[.tar.gz|.zip]
  # Do not change these names without updating do_update() in
  # crates/reliary-agent/src/main.rs.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
            ext: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            os: darwin
            arch: aarch64
            ext: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
          NAME=reliary-agent-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/reliary dist/${NAME}
          strip dist/${NAME} || true
          cd dist && tar -czf ${NAME}.tar.gz ${NAME}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reliary-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0          # gh --generate-notes needs the tag history

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/* \
          || gh release upload "${{ github.ref_name }}" dist/* \
               --repo "${{ github.repository }}" --clobber
