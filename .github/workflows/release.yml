name: Release

on:
  push:
    tags: ['v*']
  # Manual build of the full platform matrix without cutting a release. Used to
  # verify a target (especially Windows) before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build one artifact per supported platform. Asset naming is the contract the
  # `reliary update` subcommand depends on:
  #   reliary-agent-v{VERSION}-{os}-{arch}[.tar.gz|.zip]
  # Do not change these names without updating do_update() in
  # crates/reliary-agent/src/main.rs.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            ext: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            ext: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
            ext: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            os: darwin
            arch: aarch64
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            ext: ".exe"
          # aarch64 Windows is cross-compiled from the x64 runner. It is the
          # least-used target and the most likely to break on a toolchain bump,
          # so a failure here does not block the release; it just omits the
          # asset. (Same policy as the other Reliary repos.)
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os: windows
            arch: aarch64
            ext: ".exe"
    continue-on-error: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # On a tag the version is the tag; on a manual dispatch there is no
          # tag, so fall back to the workspace version for sensible names.
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v*) VERSION="${VERSION#v}" ;;
            *)  VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/') ;;
          esac
          NAME="reliary-agent-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          BIN="target/${{ matrix.target }}/release/reliary${{ matrix.ext }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "$BIN" "dist/${NAME}.exe"
            cd dist && 7z a "${NAME}.zip" "${NAME}.exe"
          else
            cp "$BIN" "dist/${NAME}"
            strip "dist/${NAME}" || true
            cd dist && tar -czf "${NAME}.tar.gz" "${NAME}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reliary-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    # Manual dispatches only build the matrix; there is no tag to release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0          # gh --generate-notes needs the tag history

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/* \
          || gh release upload "${{ github.ref_name }}" dist/* \
               --repo "${{ github.repository }}" --clobber
